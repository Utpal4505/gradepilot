<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GradePilot — Student Academic Command Center</title>
  <meta name="description" content="Your semester dashboard. Enter subjects, set a target, and discover what to focus on.">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      safelist: [
        // Difficulty colors (emerald=easy, amber=medium, rose=hard)
        'bg-emerald-100', 'bg-emerald-900/30', 'text-emerald-700', 'text-emerald-300', 'text-emerald-800',
        'border-emerald-500', 'dark:bg-emerald-900/30', 'dark:text-emerald-300',
        'bg-amber-100', 'bg-amber-900/30', 'text-amber-700', 'text-amber-300', 'text-amber-800',
        'border-amber-500', 'dark:bg-amber-900/30', 'dark:text-amber-300',
        'bg-rose-100', 'bg-rose-900/30', 'text-rose-700', 'text-rose-300', 'text-rose-800',
        'border-rose-500', 'dark:bg-rose-900/30', 'dark:text-rose-300',
        // Risk indicator colors
        'text-rose-500', 'text-amber-500', 'text-emerald-500',
      ],
      theme: {
        extend: {
          colors: {
            primary: {
              50: '#eef2ff', 100: '#e0e7ff', 200: '#c7d2fe', 300: '#a5b4fc',
              400: '#818cf8', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca',
              800: '#3730a3', 900: '#312e81', 950: '#1e1b4b'
            }
          }
        }
      }
    }
  </script>
  
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-200 min-h-screen transition-colors duration-300">
  
  <!-- Top Navigation Bar -->
  <nav class="sticky top-0 z-50 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-700">
    <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <span class="text-2xl animate-float inline-block">✈️</span>
        <h1 class="text-xl font-bold bg-gradient-to-r from-primary-600 to-violet-600 dark:from-primary-400 dark:to-violet-400 bg-clip-text text-transparent">
          GradePilot
        </h1>
      </div>
      <div class="flex items-center gap-3">
        <button id="theme-toggle" class="p-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors focus:outline-none focus:ring-2 focus:ring-primary-500" aria-label="Toggle theme">
          <span class="dark:hidden">🌙</span>
          <span class="hidden dark:inline">☀️</span>
        </button>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <main id="app" class="max-w-5xl mx-auto px-4 py-8 animate-fade-in">
    <!-- Views are rendered here by app.js -->
  </main>

  <!-- Footer -->
  <footer class="text-center py-6 text-sm text-slate-400 dark:text-slate-600 mt-auto">
    Built with 💜 by GradePilot &bull; Your semester, your strategy
  </footer>

  <!-- JS Modules -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
